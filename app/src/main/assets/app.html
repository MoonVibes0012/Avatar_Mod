<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>VTuber Forge</title>
    <link rel="stylesheet" href="css/style.css" onerror="window.__vtfStyleFailed=true;">
</head>
<body>
    <canvas id="gl"></canvas>

    <div id="loadingOverlay" aria-live="polite" style="display:none">
        <div class="loading-box">
            <div class="loading-spinner"></div>
            <div id="loadingText">Memuat VTuber Forge...</div>
        </div>
    </div>

    <div class="top">
        <button id="parts" type="button" aria-label="Buka panel menu">☰ MENU</button>
        <button id="btnUndo" type="button" title="Undo (Ctrl+Z)">↶</button>
        <button id="btnRedo" type="button" title="Redo (Ctrl+Y)">↷</button>
        <button id="btnNew" type="button" title="Scene Baru">📄</button>
        <button id="btnSave" type="button" title="Simpan Scene JSON">💾</button>
        <button id="btnImport" type="button" title="Import Model / Tekstur">📁</button>
        <button id="btnScreenshot" type="button" title="Screenshot PNG">📸</button>
        <button id="btnGpuSettings" type="button" title="Pengaturan GPU">🎮</button>
        <button id="btnDebug" type="button" title="Toggle Debug Log">🐞</button>
        <button id="inspector" type="button" aria-label="Buka panel inspeksi">INSPECT ⚙</button>
    </div>

    <div id="panelBackdrop" class="panel-backdrop" hidden></div>

    <aside class="panel left" id="left" aria-label="Panel Menu">
        <div class="panel-header">
            <span class="panel-title">MENU</span>
            <button type="button" class="btn-close-panel" data-panel="left" aria-label="Tutup Menu">✕</button>
        </div>
        <div class="panel-body" id="leftBody"></div>
    </aside>

    <aside class="panel right" id="right" aria-label="Panel Inspeksi">
        <div class="panel-header">
            <span class="panel-title">INSPECT</span>
            <button type="button" class="btn-close-panel" data-panel="right" aria-label="Tutup Inspeksi">✕</button>
        </div>
        <div class="panel-body" id="rightBody"></div>
    </aside>

    <div id="status">Siap!</div>
    <div id="debugOverlay" style="display:none"></div>
    <input type="file" id="file" accept=".glb,.gltf,.vrm,.obj,.fbx,.dds,image/vnd-ms.dds" hidden>
    <input type="file" id="jsonFile" accept=".json" hidden>

    <!-- PlayCanvas + MediaPipe + Kalidokit Lokal -->
    <script src="js/playcanvas.min.js"></script>
    <script src="js/face_mesh.js"></script>
    <script src="js/kalidokit.umd.js"></script>

    <!-- Core (Config & Debug Harus Paling Awal) -->
    <script src="js/core/config.js"></script>
    <script src="js/core/debug.js"></script>
    <script src="js/core/pc_compat.js"></script>
    <script src="js/core/pc_compat2.js"></script>
    <script src="js/core/procedural_motion_loop.js"></script>
    <script src="js/core/init.js"></script>
    <script src="js/core/gpu_context_recovery.js"></script>
    <script src="js/core/gpu_stability.js"></script>

    <!-- Camera & Controls -->
    <script src="js/camera/controls.js"></script>

    <!-- Scene & Serialization (Diperlukan sebelum Entities/IO) -->
    <script src="js/scene/serialize.js"></script>
    <script src="js/io/history.js"></script>
    <script src="js/io/save_load.js"></script>

    <!-- Entities & Editing -->
    <script src="js/entities/create.js"></script>
    <script src="js/entities/select.js"></script>
    <script src="js/entities/split.js"></script>
    <script src="js/entities/group_clone_ops.js"></script>
    <script src="js/entities/operations.js"></script>
    <script src="js/editing/bone.js"></script>
    <script src="js/editing/smooth.js"></script>
    <script src="js/editing/vertex.js"></script>

    <!-- Animation -->
    <script src="js/animation/character_driver.js"></script>

    <!-- IO & Face Tracking -->
    <script src="js/io/dds_loader.js"></script>
    <script src="js/io/glb_loader.js"></script>
    <script src="js/io/import.js"></script>
    <script src="js/io/export.js"></script>
    <script src="js/io/vrm_exporter.js"></script>
    <script src="js/tracking/face.js"></script>

    <!-- Gerak Anatomi VRM (Kotak Kecil -> Bola Penanda -> Geser Bagian) -->
    <script src="js/anatomy/anatomy_registry.js"></script>
    <script src="js/anatomy/vrm_part_extractor.js"></script>
    <script src="js/anatomy/anchor_boxes.js"></script>
    <script src="js/anatomy/selection_sphere.js"></script>
    <script src="js/anatomy/anatomy_solver.js"></script>
    <script src="js/anatomy/anatomy_poses.js"></script>
    <script src="js/anatomy/anatomy_expression_link.js"></script>
    <script src="js/anatomy/anatomy_diagnostics.js"></script>
    <script src="js/anatomy/anatomy_bridge_ui.js"></script>
    <script src="js/anatomy/anatomy_touch_hud_view.js"></script>
    <script src="js/anatomy/anatomy_touch_hud.js"></script>

    <!-- UI (Boot harus paling akhir) -->
    <script src="js/ui/panels_template.js"></script>
    <script src="js/ui/expressions.js"></script>
    <script src="js/ui/material_inputs.js"></script>
    <script src="js/ui/transform_inputs.js"></script>
    <script src="js/ui/motion_controls.js"></script>
    <script src="js/ui/toolbar.js"></script>
    <script src="js/ui/gpu_settings_ui.js"></script>
    <script src="js/ui/boot.js"></script>
</body>
</html>
