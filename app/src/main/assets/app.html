<!doctype html>
<html lang="id" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>VTuber Forge</title>
    <link rel="stylesheet" href="css/style.css" onerror="window.__vtfStyleFailed=true">
    <script src="js/playcanvas.min.js" onerror="window.__vtfPcFailed=true"></script>
    <script src="js/face_mesh.js" onerror="window.__vtfFmFailed=true"></script>
    <script src="js/kalidokit.umd.js" onerror="window.__vtfKkFailed=true"></script>
</head>
<body>

<noscript>
    <div class="noscript-banner">
        JavaScript wajib aktif untuk VTuber Forge.
    </div>
</noscript>

<div id="loadingOverlay" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div id="loadingText">Memproses Model...</div>
</div>

<div class="app">
    <div class="top">
        <div class="brand">VTuber Forge</div>
        <span class="badge">v0.1</span>
        <button type="button" id="parts" class="top-btn" data-panel="left" aria-expanded="false" aria-controls="left" aria-label="Menu">☰</button>
        <button type="button" id="inspector" class="top-btn" data-panel="right" aria-expanded="false" aria-controls="right" aria-label="Inspect">⚙</button>
        <button type="button" id="btnUndo" title="Undo (Z)" aria-label="Undo">↶</button>
        <button type="button" id="btnRedo" title="Redo (Y)" aria-label="Redo">↷</button>
        <button type="button" id="btnSave" title="Save Scene" aria-label="Save Scene">💾</button>
        <button type="button" id="btnImport" title="Import GLB/VRM" aria-label="Import Model">📥</button>
        <button type="button" id="btnScreenshot" title="Screenshot" aria-label="Screenshot">📸</button>
        <button type="button" id="btnFaceTrack" title="Face Tracking" aria-label="Face Tracking">📷</button>
        <button type="button" id="btnCharDriver" title="Character Driver" aria-label="Character Driver">🎭</button>
        <button type="button" id="btnGpuSettings" title="Pengaturan GPU" aria-label="Pengaturan GPU">🎮</button>
        <button type="button" id="btnDebug" title="Toggle Debug Log" aria-label="Debug Log">🐛</button>
    </div>

    <div class="work">
        <button type="button" id="panelBackdrop" hidden aria-label="Tutup panel"></button>

        <div class="panel" id="left" role="dialog" aria-label="Menu">
            <div class="panel-header">
                <h3>☰ MENU</h3>
                <button type="button" class="btn-close-panel" data-panel="left" aria-label="Tutup menu">✕ Tutup</button>
            </div>
            <div id="leftBody"></div>
        </div>

        <div class="viewport">
            <canvas id="gl"></canvas>
            <div class="hud">
                <span id="sel">Nothing selected</span>
                <span id="mode">OBJECT</span>
            </div>
        </div>

        <div class="panel" id="right" role="dialog" aria-label="Inspect">
            <div class="panel-header">
                <h3>⚙ INSPECT</h3>
                <button type="button" class="btn-close-panel" data-panel="right" aria-label="Tutup inspect">✕ Tutup</button>
            </div>
            <div id="rightBody"></div>
        </div>
    </div>

    <div class="status">
        <span id="status">Viewport aktif. Import GLB/VRM atau tambah object.</span>
        <span class="status-actions">
            <button type="button" id="saveLogBtn" class="save-log-btn">Save Log</button>
        </span>
    </div>

    <input id="file" class="hidden-file-input" type="file" accept=".glb,.vrm,.gltf,application/octet-stream,model/gltf-binary,model/gltf+json,*/*" />
    <input id="jsonFile" class="hidden-file-input" type="file" accept=".json,application/json,text/plain,*/*" />
</div>

<div id="debugOverlay"></div>

<!-- Core -->
<script src="js/core/config.js"></script>
<script src="js/core/debug.js"></script>
<script src="js/core/init.js"></script>
<script src="js/core/gpu_stability.js"></script>

<!-- Panels template (harus di-load sebelum UI & entities) -->
<script src="js/ui/panels_template.js"></script>

<!-- Camera -->
<script src="js/camera/controls.js"></script>

<!-- Entities -->
<script src="js/entities/create.js"></script>
<script src="js/entities/select.js"></script>
<script src="js/entities/operations.js"></script>
<script src="js/entities/split.js"></script>

<!-- Editing -->
<script src="js/editing/vertex.js"></script>
<script src="js/editing/smooth.js"></script>
<script src="js/editing/bone.js"></script>

<!-- Animation -->
<script src="js/animation/character_driver.js"></script>

<!-- Scene & I/O -->
<script src="js/scene/serialize.js"></script>
<script src="js/io/import.js"></script>
<script src="js/io/export.js"></script>
<script src="js/io/vrm_exporter.js"></script>
<script src="js/io/history.js"></script>
<script src="js/io/save_load.js"></script>

<!-- Face Tracking -->
<script src="js/tracking/face.js"></script>

<!-- Anatomy -->
<script src="js/anatomy/anatomy_registry.js"></script>
<script src="js/anatomy/vrm_part_extractor.js"></script>
<script src="js/anatomy/anchor_boxes.js"></script>
<script src="js/anatomy/selection_sphere.js"></script>
<script src="js/anatomy/anatomy_solver.js"></script>
<script src="js/anatomy/anatomy_bridge_ui.js"></script>

<!-- UI -->
<script src="js/ui/expressions.js"></script>
<script src="js/ui/transform_inputs.js"></script>
<script src="js/ui/toolbar.js"></script>
<script src="js/ui/gpu_settings_ui.js"></script>
<script src="js/ui/boot.js"></script>

</body>
</html>
