<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08080b">
    <title>VTuber Forge</title>
    <link id="mainStylesheet" rel="stylesheet" href="css/style.css">
    <script>
    (function () {
        var styleCandidates = ['css/style.css', './css/style.css', 'file:///android_asset/css/style.css', 'style.css'];
        var candidateIdx = 0;

        function tryNextStyle() {
            var link = document.getElementById('mainStylesheet');
            if (!link) return;
            candidateIdx++;
            if (candidateIdx >= styleCandidates.length) {
                window.__vtfStyleFailed = true;
                if (typeof console !== 'undefined' && console.warn) {
                    console.warn('[VTuber Forge] Gagal memuat css/style.css dari semua path.');
                }
                return;
            }
            var nextHref = styleCandidates[candidateIdx];
            var fallbackLink = document.createElement('link');
            fallbackLink.rel = 'stylesheet';
            fallbackLink.href = nextHref;
            fallbackLink.onload = function () {
                window.__vtfStyleFailed = false;
                window.__vtfLoadedStyleHref = nextHref;
            };
            fallbackLink.onerror = tryNextStyle;
            document.head.appendChild(fallbackLink);
        }

        window.addEventListener('DOMContentLoaded', function () {
            var link = document.getElementById('mainStylesheet');
            if (!link) return;
            link.addEventListener('error', tryNextStyle);
            link.addEventListener('load', function () {
                window.__vtfStyleFailed = false;
                window.__vtfLoadedStyleHref = link.getAttribute('href');
            });
        });
    })();
    </script>
</head>
<body>
    <div class="app">
        <!-- TOP BAR -->
        <div class="top">
            <span class="brand">VTuber Forge <span class="badge">v0.1</span></span>
            <button type="button" id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
            <button type="button" id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
            <button type="button" id="btnSave" title="Save Scene JSON">💾</button>
            <button type="button" id="btnImport" title="Import GLB/VRM">📥</button>
            <button type="button" id="btnScreenshot" title="Screenshot">📸</button>
            <button type="button" id="parts" title="Menu Objek & Primitives" data-panel="left" aria-expanded="false">☰ Menu</button>
            <button type="button" id="inspector" title="Inspector & Transform" data-panel="right" aria-expanded="false">⚙️ Inspect</button>
            <button type="button" id="btnCharDriver" title="Character Driver — animasi procedural">🎭</button>
            <button type="button" id="btnFaceTrack" title="Face Tracking — kamera depan">📷</button>
            <button type="button" id="btnDebug" title="Toggle Debug Log">🐛</button>
        </div>

        <!-- WORK AREA -->
        <div class="work">
            <div class="viewport">
                <canvas id="gl"></canvas>
                <div class="hud">
                    <span id="mode">OBJECT</span>
                    <span id="sel">Nothing selected</span>
                </div>
            </div>
            <div id="panelBackdrop" hidden></div>
            <div id="panelHost"></div>
        </div>

        <!-- STATUS BAR -->
        <div class="status">
            <span id="status">Ready.</span>
            <span style="margin-left:auto;">
                <button type="button" id="saveLogBtn" style="font-size:10px; padding:2px 6px;">Save Log</button>
            </span>
        </div>
    </div>

    <!-- HIDDEN FILE INPUTS & OVERLAYS -->
    <input type="file" id="file" accept=".glb,.vrm,.gltf" style="display:none;">
    <input type="file" id="jsonFile" accept=".json" style="display:none;">
    <div id="debugOverlay" role="log" aria-live="polite"></div>
    <div id="loadingOverlay" aria-live="polite">
        <div class="spinner"></div>
        <div id="loadingText">Memproses Model...</div>
    </div>
    <noscript><div class="noscript-banner">VTuber Forge butuh JavaScript.</div></noscript>

    <!-- OFFLINE SCRIPTS -->
    <script src="js/playcanvas.min.js"></script>
    <script src="js/face_mesh.js"></script>
    <script src="js/kalidokit.umd.js"></script>
    <script src="js/ui/panels_template.js"></script>
    <script src="js/ui/boot.js"></script>

    <!-- Core -->
    <script src="js/core/config.js"></script>
    <script src="js/core/debug.js"></script>
    <script src="js/core/init.js"></script>

    <!-- Camera -->
    <script src="js/camera/controls.js"></script>

    <!-- Entities -->
    <script src="js/entities/create.js"></script>
    <script src="js/entities/select.js"></script>
    <script src="js/entities/operations.js"></script>
    <script src="js/entities/split.js"></script>

    <!-- Editing -->
    <script src="js/editing/vertex.js"></script>
    <script src="js/editing/bone.js"></script>
    <script src="js/editing/smooth.js"></script>

    <!-- IO -->
    <script src="js/io/import.js"></script>
    <script src="js/io/export.js"></script>
    <script src="js/io/save_load.js"></script>
    <script src="js/scene/serialize.js"></script>

    <!-- Tracking & Animation UI -->
    <script src="js/tracking/face.js"></script>
    <script src="js/ui/toolbar.js"></script>
    <script src="js/ui/expressions.js"></script>
    <script src="js/animation/character_driver.js"></script>
</body>
</html>
